<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Субагенты в чате — прототип Swiss</title>
<!-- Throwaway prototype: three Swiss layouts on the same timeline, from agent_spawn to agent_send. -->
<style>
	* { box-sizing: border-box; }
	body { margin: 0; background: #eaeaea; color: #111; font: 14px/1.45 system-ui, sans-serif; }
	main { width: min(1160px, calc(100% - 24px)); margin: 16px auto 64px; }
	h1 { margin: 0; font-size: 19px; }
	p { margin: 0; }
	button, select { font: inherit; color: inherit; }
	button { cursor: pointer; }
	:focus-visible { outline: 2px solid #497ef5; outline-offset: 2px; }
	.controls { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 10px 0 6px; }
	.controls > div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
	.controls button, .controls select { background: #fafafa; border: 1px solid #bcbcbc; padding: 2px 7px; }
	.controls button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
	#note { margin-bottom: 8px; color: #434343; }
	.terminal {
		--bg: #fff; --raised: #f2f2f2; --code: #f5f5f5; --text: #000; --muted: #555; --faint: #747474;
		--border: #e3e3e3; --signal: #e10600; --bar: #000; --bar-text: #fff; --bar-muted: #bdbdbd;
		--inline: #f1f3f8; --link: #0040c1;
		position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto auto;
		height: min(72vh, 35lh); min-height: 23lh; margin-inline: auto;
		background: var(--bg); color: var(--text); font: 15px/1.38 "Adwaita Mono", "DejaVu Sans Mono", monospace;
	}
	.terminal[data-theme="dark"] {
		--bg: #121212; --raised: #222; --code: #1a1a1a; --text: #ececec; --muted: #a8a8a8; --faint: #939393;
		--border: #2e2e2e; --signal: #ff453a; --bar: #262626; --bar-text: #fff; --bar-muted: #a8a8a8;
		--inline: #1b2333; --link: #6ea8ff;
	}
	.terminal[data-width="narrow"] { max-width: 55ch; }
	.chat { overflow: auto; padding: 1lh clamp(12px, 4vw, 4ch); }
	.user { display: flex; justify-content: space-between; gap: 2ch; background: var(--raised); padding: 1lh 2ch; margin-inline: -1ch; }
	.user span, .thinking, .divider, .disclosure { color: var(--faint); }
	.thinking, .calls, .agents, .reply, .user + .user { margin-top: 1lh; }
	.thinking i { color: var(--muted); }
	.tool, .agent { display: grid; align-items: baseline; gap: 1ch; }
	.tool { grid-template-columns: 13ch minmax(0, 1fr) auto; }
	.clip { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
	.chip { background: var(--text); color: var(--bg); padding-inline: 1ch; width: max-content; }
	.state { color: var(--faint); white-space: nowrap; }
	.active, .prompt, .reply li::marker { color: var(--signal); }
	.reply { border-top: 1px solid var(--border); padding-block: .6lh 1lh; }
	.reply ul { list-style: "– "; padding-left: 2ch; margin: .4lh 0 0; }
	code { color: var(--link); background: var(--inline); font: inherit; }
	.agent { width: 100%; padding: 0; border: 0; font: inherit; text-align: left; background: transparent; }
	.agent:hover { background: var(--raised); }
	.a .agent .label { color: var(--muted); }
	.b .agents { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
	.b .roster { background: var(--code); padding: 0 1ch; display: flex; justify-content: space-between; color: var(--muted); }
	.b .agent { grid-template-columns: 8ch minmax(0, 1fr) auto; padding-inline: 1ch; }
	.b .agent .label { color: var(--muted); }
	.c .agents { display: grid; gap: .5lh; }
	.c .agent { grid-template-columns: minmax(0, 1fr) auto; row-gap: 0; padding: .25lh 1ch; border-left: 2px solid var(--border); background: var(--code); }
	.c .agent:hover { background: var(--raised); }
	.c .agent:has(.active) { border-color: var(--signal); }
	.c .preview { grid-column: 1 / -1; color: var(--muted); }
	.composer { margin-inline: 2ch; border-top: 2px solid var(--text); padding: .75lh 1.5ch .5lh; }
	.hints, .bottom { display: flex; justify-content: space-between; gap: 1ch; }
	.hints { color: var(--faint); margin-top: 1lh; }
	.bottom { background: var(--bar); color: var(--bar-muted); padding-inline: 1ch; white-space: nowrap; }
	.bottom b:not(.active) { color: var(--bar-text); }
	.bottom .active { color: #ff4a3d; }
	.switcher {
		position: fixed; z-index: 1; bottom: 8px; left: 50%; transform: translateX(-50%);
		display: flex; align-items: center; gap: 8px; white-space: nowrap; background: #151515; color: #fff;
		padding: 4px; border: 1px solid #626262; box-shadow: 0 2px 8px #0003;
	}
	.switcher button { background: #333; border: 0; padding: 2px 9px; }
	#variant { width: 17ch; text-align: center; }
	dialog {
		width: min(65ch, calc(100% - 24px)); background: var(--bg); color: var(--text); font: inherit;
		border: 0; border-top: 2px solid var(--text); padding: .5lh 2ch 1lh;
	}
	dialog::backdrop { background: #0006; }
	dialog header { display: flex; justify-content: space-between; margin-bottom: 1lh; }
	dialog button { border: 0; background: transparent; color: var(--muted); }
	@media (max-width: 465px) {
		.terminal { font-size: 13px; }
		.tool { gap: .5ch; }
		.hints > :last-child { display: none; }
	}
</style>
<main>
	<h1>Субагенты в чате · прототип</h1>
	<p>Сравните A/B/C и нажмите <code>agent_send</code>, чтобы увидеть перемещение карточки. Клик по карточке открывает журнал.</p>
	<div class="controls">
		<div role="group" aria-label="Шаг сценария">
			<button type="button" data-step="0">Запуск</button>
			<button type="button" data-step="1">Первый ответ</button>
			<button type="button" data-step="2">agent_send</button>
			<button type="button" data-step="3">Второй ответ</button>
		</div>
		<div>
			<label for="target">Кому:</label>
			<select id="target"><option>lio</option><option selected>fay</option><option>bo</option></select>
			<button type="button" id="theme" aria-pressed="false">Тёмная тема</button>
			<button type="button" id="width" aria-pressed="false">Узкое окно</button>
		</div>
	</div>
	<p id="note" aria-live="polite"></p>
	<section class="terminal" aria-label="Макет чата Pi OpenTUI">
		<div class="chat" id="chat" tabindex="0" aria-label="История чата"></div>
		<div class="composer" aria-hidden="true">
			<b class="prompt">›</b>
			<div class="hints"><span>/ commands　@ files</span><span>⏎ send　⇧⏎ new line</span></div>
		</div>
		<div class="bottom"><span class="clip"><b>deepseek-v4.1-flash</b> · high　 openTUI · main</span><b id="working" class="active"></b></div>
		<dialog id="log" aria-labelledby="logTitle">
			<header><b id="logTitle"></b><form method="dialog"><button aria-label="Закрыть журнал">esc</button></form></header>
			<div id="logBody"></div>
		</dialog>
	</section>
</main>
<nav class="switcher" aria-label="Вариант дизайна">
	<button type="button" id="prev" aria-label="Предыдущий вариант">←</button>
	<output id="variant"></output>
	<button type="button" id="next" aria-label="Следующий вариант">→</button>
</nav>
<script>
	const $ = (id) => document.getElementById(id);
	const chat = $("chat");
	const terminal = chat.parentElement;
	const steps = [...document.querySelectorAll("[data-step]")];
	const variants = ["A · В строке вызова", "B · Реестр", "C · Превью"];
	const agents = [
		{ id: "lio", label: "Цитата 1", quote: "Тишина — не отсутствие ответа: это место, где он успевает стать твоим.", revision: "В тишине ответ становится твоим.", time: "5.7s" },
		{ id: "fay", label: "Цитата 2", quote: "Мудрый не тот, кто реже ошибается, а тот, кто раньше замечает, что ошибся.", revision: "Мудрость — заметить, что ошибся.", time: "5.6s" },
		{ id: "bo", label: "Цитата 3", quote: "Мы тонем не в глубине, а в попытках удержать на поверхности всё сразу.", revision: "Тонет тот, кто пытается удержать всё.", time: "6.0s" },
	];
	const initialVariant = new URLSearchParams(location.search).get("variant");
	let variant = Math.max(0, variants.findIndex((name) => name[0] === initialVariant));
	let step = 1;
	const target = () => agents.find((agent) => agent.id === $("target").value);
	const state = (active, text) => `<span class="state${active ? " active" : ""}">${active ? "◐" : "●"} ${text}</span>`;
	const user = (text) => `<p class="user"><b>${text}</b><span>you</span></p>`;
	const thinking = '<p class="thinking">▸ <i>Thinking</i></p>';
	const task = "Придумай короткую мудрую цитату.";
	const followUp = "Сделай цитату короче.";
	const reply = (html) => `<div class="reply">${html}</div>`;
	const marker = '<span class="disclosure" aria-hidden="true">▸</span>';
	const identity = (agent) => `${marker} <strong>@${agent.id}</strong>`;
	const agentState = (pending) => state(pending, pending ? "running" : "idle");
	const agentButton = (agent, pending, content, extra = "") =>
		`<button type="button" class="agent ${extra}" data-agent="${agent.id}" aria-label="Журнал @${agent.id}: ${agent.label}, ${pending ? "running" : "idle"}">${content}</button>`;

	function tool(name, args, pending, time, agent) {
		const chip = `<b class="chip">${name}</b>`;
		if (variant === 0 && agent) {
			return agentButton(agent, pending, `${chip}<span class="clip">${identity(agent)} <span class="label">/ ${agent.label}</span></span>${agentState(pending)}`, "tool");
		}
		return `<div class="tool">${chip}<span class="clip">${args}</span>${state(pending, pending ? "running" : time)}</div>`;
	}

	function group(list, pending, sent = false) {
		const anchor = sent ? "send" : "spawn";
		const name = `agent_${anchor}`;
		const args = sent ? `@${list[0].id} · ${followUp}` : task;
		const calls = list.map((agent) => tool(name, args, pending, sent ? "2.1s" : agent.time, !sent && step > 1 && agent === target() ? undefined : agent));
		const current = list.filter((agent) => sent || step < 2 || agent !== target());
		const callRows = `<div class="calls"${variant === 0 ? ` data-anchor="${anchor}"` : ""}>${calls.join("")}</div>`;
		if (variant === 0) return callRows;
		const heading = variant === 1 ? `<div class="roster"><strong>Субагенты</strong><span>${current.length}</span></div>` : "";
		const rows = current.map((agent) => {
			if (variant === 1) {
				return agentButton(agent, pending, `<span>${identity(agent)}</span><span class="label clip">${agent.label}</span>${agentState(pending)}`);
			}
			const summary = pending ? (sent ? followUp : task) : `«${sent ? agent.revision : agent.quote}»`;
			return agentButton(agent, pending,
				`<span class="clip">${identity(agent)} <span class="divider">/</span> ${agent.label}</span>${agentState(pending)}<span class="preview clip">${summary}</span>`);
		});
		return callRows + `<section class="agents" aria-label="Субагенты" data-anchor="${anchor}">${heading}${rows.join("")}</section>`;
	}

	function render() {
		const agent = target();
		terminal.classList.remove("a", "b", "c");
		terminal.classList.add("abc"[variant]);
		$("variant").textContent = variants[variant];
		steps.forEach((button, index) => button.setAttribute("aria-pressed", index === step));
		$("working").textContent = step === 0 || step === 2 ? "◐ working" : "";
		$("note").textContent = [
			"Карточки появились рядом с вызовами agent_spawn.",
			"Ответ добавился ниже, а карточки остались рядом с agent_spawn.",
			`@${agent.id} теперь рядом с agent_send. Остальные карточки остались у agent_spawn.`,
			`Карточка @${agent.id} осталась рядом с agent_send, выше нового ответа.`,
		][step];

		chat.innerHTML = user("Вызови трёх субагентов. Пусть каждый придумает мудрую цитату.") + thinking +
			group(agents, step === 0) +
			(step > 0 ? reply(`Три субагента придумали по цитате:<ul>${agents.map((a) => `<li>«${a.quote}»</li>`).join("")}</ul>`) : "") +
			(step > 1 ? user(`Попроси @${agent.id} сократить свою цитату.`) + thinking +
				group([agent], step === 2, true) : "") +
			(step === 3 ? reply(`Вот короткая версия от <code>@${agent.id}</code>: «${agent.revision}»`) : "");
		chat.scrollTop = step > 1 ? chat.scrollHeight : 0;
	}

	for (const button of steps) button.onclick = () => {
		step = Number(button.dataset.step);
		render();
	};
	$("target").onchange = render;
	for (const [id, field, value] of [["theme", "theme", "dark"], ["width", "width", "narrow"]]) {
		$(id).onclick = () => {
			const enabled = terminal.dataset[field] !== value;
			terminal.dataset[field] = enabled ? value : "";
			$(id).setAttribute("aria-pressed", enabled);
		};
	}
	function switchVariant(direction) {
		variant = (variant + direction + variants.length) % variants.length;
		const url = new URL(location.href);
		url.searchParams.set("variant", variants[variant][0]);
		history.replaceState(null, "", url);
		render();
	}
	$("prev").onclick = () => switchVariant(-1);
	$("next").onclick = () => switchVariant(1);
	document.addEventListener("keydown", (event) => {
		if ($("log").open || event.target.closest("input, textarea, select, [contenteditable]")) return;
		if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
		event.preventDefault();
		switchVariant(event.key === "ArrowLeft" ? -1 : 1);
	});
	chat.addEventListener("click", (event) => {
		const row = event.target.closest("[data-agent]");
		if (!row) return;
		const agent = agents.find((a) => a.id === row.dataset.agent);
		const sent = step > 1 && target() === agent;
		$("logTitle").textContent = `@${agent.id} / ${agent.label}`;
		$("logBody").innerHTML = `<p class="prompt">› ${task}</p>` +
			(step > 0 ? `<p>${agent.quote}</p>` : thinking) +
			(sent ? `<p class="prompt">› ${followUp}</p>${step === 2 ? thinking : `<p>${agent.revision}</p>`}` : "");
		$("log").showModal();
	});
	render();
</script>
</html>
